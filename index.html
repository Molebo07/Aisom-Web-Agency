    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "Is Aisom free to use?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — the Free plan gives you up to 50 cards and basic search. No credit card required. Upgrade to Pro (R150/mo) for unlimited cards, AI semantic search, and spaced repetition." } },
        { "@type": "Question", "name": "How is Aisom different from Notion or Obsidian?", "acceptedAnswer": { "@type": "Answer", "text": "Aisom is purpose-built for developers. Instead of blank pages, you get structured card types (Bug Cards, ADRs, Concept Cards) designed around how engineers actually capture knowledge. Semantic search finds answers by meaning, not just keywords." } },
        { "@type": "Question", "name": "Can I import my existing notes?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — Pro users can import from Obsidian (markdown files). We parse your existing notes and suggest card types. More import sources (Notion, GitHub Issues) are on the roadmap." } },
        { "@type": "Question", "name": "Is my data secure?", "acceptedAnswer": { "@type": "Answer", "text": "Absolutely. All data is encrypted at rest and in transit. Row-level security ensures you can only access your own cards. We never train AI models on your data." } },
        { "@type": "Question", "name": "Does the spaced repetition actually work?", "acceptedAnswer": { "@type": "Answer", "text": "It uses the SM-2 algorithm — the same proven system behind Anki. Each morning, your Daily Brief surfaces 3 cards at the optimal review interval." } },
        { "@type": "Question", "name": "Can I use Aisom with my team?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — the Team plan (R250/user/month) includes shared card libraries, a team ADR repository, shared bug knowledge base, admin dashboard, and SSO via Google Workspace." } }
      ]
    }
